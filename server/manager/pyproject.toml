[project]
name = "budka-manager"
version = "0.1.0"
description = "Chytra budka management server: enrollment CA, OTA store, device UI/API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "cryptography>=43,<46",
    "python-multipart>=0.0.9",
    "aiomqtt>=2.3,<3",
    "pillow>=10,<12",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9,<3",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2"]
postgres = ["asyncpg>=0.29"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["budka_manager*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
