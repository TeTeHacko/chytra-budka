# ACL for the mTLS device listener (8883).
# Username == certificate CN == bare device id (cb-<6hex>), so %u confines every
# device to its own topic prefix. This is the versioned replacement for the
# hand-clicked ACLs on the old HA Mosquitto add-on (they were the load-bearing
# trust anchor for MQTT enrollment; enrollment itself moves to HTTPS, but the
# write-isolation property is kept).

pattern readwrite %u/#
pattern write homeassistant/+/%u/+/config
topic read homeassistant/status

# HIL runner (firmware/tests/hil) — a workstation, not a device, so it gets an
# explicitly issued client cert (server/scripts/issue-client-cert.sh) instead of
# enrolling. It uses 8883 because that is the broker port already exposed;
# nothing new is opened for tests, and no running service is borrowed.
#
# Scoped to the bench board on purpose. The certificate lives on a developer
# workstation, so if it leaks the blast radius is the board on the desk — not
# the fleet. Widen this only by adding the specific board being tested.
user hil-runner
topic readwrite cb-ex01/#
topic read homeassistant/+/cb-ex01/+/config
topic read homeassistant/status

# Operator tooling (interactive MQTT clients, the ota_upload.sh canary loop) on 8883, so
# the workstation no longer needs the house broker to reach the fleet either.
# Fleet-wide on purpose — an OTA fan-out has to reach every board, including
# ones onboarded later — which does make this a fleet-admin credential. Prefer
# hil-runner above for anything that only needs the bench.
user ops-fleet
topic readwrite #
