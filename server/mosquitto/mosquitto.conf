# Chytra budka broker — three listeners, per-listener security.
#
#   8883  public   devices, mTLS only (cert CN = identity, no passwords)
#   8884  public   ops/tools/HA, TLS + username/password
#   1883  internal service accounts on the docker network (never published)
#
# Retained image/photo payloads are up to 400 KB → max_packet_size 1 MB.

per_listener_settings true
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
max_packet_size 1048576

log_dest stdout
log_type error
log_type warning
log_type notice

# ---- devices: mTLS ----------------------------------------------------------
listener 8883
certfile /certs/le/fullchain.pem
keyfile  /certs/le/privkey.pem
cafile   /mosquitto/pki/ca_chain.pem
require_certificate true
use_identity_as_username true
listener_allow_anonymous false
acl_file /mosquitto/config/acl-devices.conf

# ---- ops: TLS + password (mqtt.sh, ota_upload.sh canary, HA, mqttui) --------
listener 8884
certfile /certs/le/fullchain.pem
keyfile  /certs/le/privkey.pem
listener_allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl-services.conf

# ---- internal: docker network only (manager, cbprom, healthcheck) -----------
listener 1883
listener_allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl-services.conf

# Optional drop-ins (e.g. 10-ha-bridge.conf during the rfa migration).
include_dir /mosquitto/config/conf.d
