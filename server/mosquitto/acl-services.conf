# ACL for password listeners (1883 internal, 8884 ops).

# Management server: full access (consumes everything, publishes cmd/*).
user svc-manager
topic readwrite #
topic read $SYS/#

# Prometheus bridge: read-only.
user svc-cbprom
topic read #
topic read $SYS/#

# Home Assistant (optional, via 8884 or bridge): full access — it renders
# entities and publishes commands just like before.
user svc-ha
topic readwrite #

# Operator tooling (interactive MQTT clients, ota_upload.sh canary loop).
user svc-ops
topic readwrite #
topic read $SYS/#

# Container healthcheck: broker uptime only.
user svc-health
topic read $SYS/broker/uptime
