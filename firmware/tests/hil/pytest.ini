[pytest]
# HIL lifecycle harness — host-side runtime tests against a real bench
# board. The lifecycle (see conftest: reset_board → @ap_mode → provisioned_sta
# → @sta_mode) factory-resets the board over MQTT, runs the AP/onboarding suite,
# provisions it onto the station LAN, then runs the connected suite. This is the
# gate tools/ota_upload.sh runs before a field deploy.
#
# Markers:
#   manual — requires a human (e.g. PIR wave, audio clap, IR LED visual).
#            Skip on the default run (-k "not manual"), include with -m manual.
#
# Default to verbose so a CI log is readable without -v; --tb=short
# keeps a failure summary compact.

# --reruns: this is a HARDWARE-in-the-loop suite over WiFi against a real bench.
# Normally-fast ops (an MQTT cfg echo, a ~2 s /photos.json, a capture) very
# occasionally spike past their per-call timeout from transient link / stack
# latency — verified: the same test passes one run and times out the next,
# while the operation itself measures fast out-of-band. Auto-retry a FAILED
# test up to 2x (15 s settle between) so a transient spike doesn't red the
# gate; a genuine fault still fails all 3 attempts. Tolerates environmental
# noise, does NOT mask device bugs. (pytest-rerunfailures — see requirements.txt)
addopts = -v --tb=short --strict-markers --reruns 2 --reruns-delay 15

markers =
    manual: requires human interaction (wave / clap / etc.)
    state_change: writes persistent state (NVS, reboot). Skip with
        `-m "not state_change"` on a deployed board.
    ap_mode: requires the bench in AP/unprovisioned mode; joins the bench
        SoftAP on the host's wlan0 (invasive — disconnects the station LAN
        for the test). Skips if the AP can't be joined.
    sta_mode: requires the bench provisioned + STA-connected. The default phase
        in the lifecycle (everything not @ap_mode); runs AFTER the AP suite and
        the AP->STA provisioning transition.
    stress: long concurrency/soak load test (opt-in via CB_STRESS=1). Hammers a
        powered bench; NOT part of the deploy gate. Run with CB_HIL_NO_RESET=1.
    sweep: camera characterisation sweep (opt-in via CB_SWEEP=1). Hundreds of
        captures to chart quality vs framesize; NOT a regression guard, so it
        stays out of the deploy gate. Run when tuning the camera.
