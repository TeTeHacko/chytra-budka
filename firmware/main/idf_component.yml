## ESP-IDF Component Manager manifest for the main app.
## Pulled by `idf.py reconfigure` into managed_components/.

dependencies:
  idf:
    # ESP-IDF v6.0.1 (mbedTLS 4.0.0) is the ONLY supported/tested toolchain
    # (v5.5/mbedTLS 3.6.6 has a TLS 1.3 server OOM bug). Pin to ~6.0 so a stray
    # `idf.py update-dependencies` can't float onto an untested major — the old
    # `>=5.5,<7.0` contradicted the "v6.0.1 only" rule in CLAUDE.md/README.
    version: "~6.0.1"
  espressif/mdns:
    version: "~1.11.1"
  espressif/esp32-camera:
    # Pinned to the tested 2.1.x (see dependencies.lock 2.1.6) — ^2.0.0 allowed
    # any 2.x, looser than what's actually validated on the bench.
    version: "~2.1.6"
  espressif/mqtt:
    version: "~1.0.0"
  espressif/qrcode:
    # QR encoder for the bench OLED (WiFi-onboarding QR). Wraps Nayuki's
    # qrcodegen; bench-only feature, soft.
    version: "~0.2.0"
