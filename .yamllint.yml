---
extends: default

rules:
  line-length:
    max: 120
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable

ignore: |
  firmware/build/
  firmware/components/flac/flac-upstream/
  firmware/managed_components/
  firmware/hw/.history/
  .github/
