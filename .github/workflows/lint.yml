---
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure

  native-tests:
    name: native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ make libflac-dev pkg-config

      - name: run native test suites
        working-directory: firmware/tests/native
        run: make test
